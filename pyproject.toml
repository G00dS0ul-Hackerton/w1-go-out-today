[project]
name = "w1-go-out-today"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "G00dS0ul", email = "iseoluwaolowogoke@student.oauife.edu.ng" }
]
requires-python = ">=3.12"
dependencies = [
    "elevenlabs>=2.71.0",
    "fastapi>=0.115.0",
    "httpx>=0.28.0",
    "pandas>=3.0.6",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.5.0",
    "tabpfn>=2.0.0",
    "torch>=2.0.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
w1-go-out-today = "w1_go_out_today:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
